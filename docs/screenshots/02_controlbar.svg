<svg xmlns="http://www.w3.org/2000/svg" width="540" height="200" viewBox="0 0 540 200">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#00000040"/>
    </filter>
  </defs>

  <!-- Background (desktop) -->
  <rect width="540" height="200" fill="#1a2744"/>

  <!-- macOS menubar -->
  <rect x="0" y="0" width="540" height="26" fill="#2a2a3aee"/>
  <text x="14" y="18" font-family="-apple-system,sans-serif" font-size="13" fill="#e0e0e0">🍎</text>
  <text x="44" y="18" font-family="-apple-system,sans-serif" font-size="11" fill="#c0c0c0">Finder  ...</text>
  <text x="430" y="18" font-family="-apple-system,sans-serif" font-size="10" fill="#c0c0c0">📋  wifi  🔋  14:31</text>

  <!-- Control Bar Panel (500×48) -->
  <rect x="20" y="50" width="500" height="48" rx="10" fill="#1c1c2e" filter="url(#shadow)" stroke="#3a3a5c" stroke-width="1"/>

  <!-- 経過時間 -->
  <text x="18" y="43" font-family="-apple-system,sans-serif" font-size="9" fill="#8888aa">経過時間</text>
  <text x="36" y="82" font-family="-apple-system,sans-serif" font-size="15" font-weight="700" fill="#7c9ff5" text-anchor="middle">12:34</text>

  <!-- Divider -->
  <line x1="66" y1="58" x2="66" y2="90" stroke="#3a3a5c" stroke-width="1"/>

  <!-- Capture target label -->
  <text x="74" y="68" font-family="-apple-system,sans-serif" font-size="9" fill="#8888aa">キャプチャ対象</text>
  <text x="74" y="82" font-family="-apple-system,sans-serif" font-size="11" fill="#d0d8ff">Microsoft Teams (ウィンドウ)</text>

  <!-- Right side buttons -->
  <!-- Count badge -->
  <rect x="324" y="57" width="44" height="34" rx="6" fill="#2a2a3e"/>
  <text x="346" y="70" font-family="-apple-system,sans-serif" font-size="9" fill="#8888aa" text-anchor="middle">枚数</text>
  <text x="346" y="85" font-family="-apple-system,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>

  <!-- Auto interval badge -->
  <rect x="374" y="57" width="50" height="34" rx="6" fill="#2a2a3e"/>
  <text x="399" y="70" font-family="-apple-system,sans-serif" font-size="9" fill="#8888aa" text-anchor="middle">自動</text>
  <text x="399" y="85" font-family="-apple-system,sans-serif" font-size="13" font-weight="600" fill="#f59e42" text-anchor="middle">1分</text>

  <!-- Camera button -->
  <rect x="430" y="57" width="38" height="34" rx="6" fill="#3b5bdb"/>
  <text x="449" y="80" font-family="-apple-system,sans-serif" font-size="18" text-anchor="middle">📷</text>

  <!-- Memo button -->
  <rect x="474" y="57" width="38" height="34" rx="6" fill="#2a2a3e" stroke="#4a4a6e" stroke-width="1"/>
  <text x="493" y="80" font-family="-apple-system,sans-serif" font-size="11" font-weight="600" fill="#a0a8d0" text-anchor="middle">Memo</text>

  <!-- Right-click hint -->
  <text x="270" y="130" font-family="-apple-system,sans-serif" font-size="11" fill="#8888aa" text-anchor="middle">右クリックでコンテキストメニュー（OCR・間隔変更・終了）</text>

  <!-- Context menu hint box -->
  <rect x="138" y="140" width="264" height="46" rx="6" fill="#252535" stroke="#3a3a5c" stroke-width="0.8" opacity="0.9"/>
  <text x="270" y="156" font-family="-apple-system,sans-serif" font-size="10" fill="#c0c0d8" text-anchor="middle">📷 今すぐキャプチャ</text>
  <text x="270" y="170" font-family="-apple-system,sans-serif" font-size="10" fill="#c0c0d8" text-anchor="middle">🔍 直近キャプチャをOCR　　⏹ 会議を終了</text>
</svg>
