<svg xmlns="http://www.w3.org/2000/svg" width="540" height="320" viewBox="0 0 540 320">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#00000040"/>
    </filter>
  </defs>

  <!-- Background (desktop) -->
  <rect width="540" height="320" fill="#1a2744"/>
  <rect x="0" y="0" width="540" height="26" fill="#2a2a3aee"/>
  <text x="14" y="18" font-family="-apple-system,sans-serif" font-size="13" fill="#e0e0e0">🍎</text>
  <text x="430" y="18" font-family="-apple-system,sans-serif" font-size="10" fill="#c0c0c0">📋  wifi  🔋  14:37</text>

  <!-- Control Bar Panel -->
  <rect x="20" y="40" width="500" height="48" rx="10" fill="#1c1c2e" filter="url(#shadow)" stroke="#3a3a5c" stroke-width="1"/>
  <text x="36" y="71" font-family="-apple-system,sans-serif" font-size="15" font-weight="700" fill="#7c9ff5" text-anchor="middle">18:41</text>
  <line x1="66" y1="48" x2="66" y2="80" stroke="#3a3a5c" stroke-width="1"/>
  <text x="74" y="62" font-family="-apple-system,sans-serif" font-size="9" fill="#8888aa">キャプチャ対象</text>
  <text x="74" y="76" font-family="-apple-system,sans-serif" font-size="11" fill="#d0d8ff">Microsoft Teams (ウィンドウ)</text>
  <rect x="324" y="47" width="44" height="34" rx="6" fill="#2a2a3e"/>
  <text x="346" y="60" font-family="-apple-system,sans-serif" font-size="9" fill="#8888aa" text-anchor="middle">枚数</text>
  <text x="346" y="75" font-family="-apple-system,sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
  <rect x="374" y="47" width="50" height="34" rx="6" fill="#2a2a3e"/>
  <text x="399" y="60" font-family="-apple-system,sans-serif" font-size="9" fill="#8888aa" text-anchor="middle">自動</text>
  <text x="399" y="75" font-family="-apple-system,sans-serif" font-size="13" font-weight="600" fill="#f59e42" text-anchor="middle">1分</text>
  <rect x="430" y="47" width="38" height="34" rx="6" fill="#3b5bdb"/>
  <text x="449" y="70" font-family="-apple-system,sans-serif" font-size="18" text-anchor="middle">📷</text>
  <!-- Memo button (active/expanded) -->
  <rect x="474" y="47" width="38" height="34" rx="6" fill="#3b5bdb" stroke="#6080ff" stroke-width="1.5"/>
  <text x="493" y="70" font-family="-apple-system,sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Memo</text>

  <!-- Memo expansion area -->
  <rect x="20" y="88" width="500" height="186" rx="0 0 10 10" fill="#13131f" stroke="#3a3a5c" stroke-width="1"/>
  <rect x="20" y="88" width="500" height="186" rx="10" fill="#13131f" stroke="#3a3a5c" stroke-width="1"/>

  <!-- Memo text content -->
  <text x="34" y="110" font-family="-apple-system,sans-serif" font-size="11" fill="#aaaacc">📷 14:33 143301.png</text>
  <text x="34" y="127" font-family="-apple-system,sans-serif" font-size="11" fill="#d0d8ff">・アジェンダ確認完了</text>
  <text x="34" y="144" font-family="-apple-system,sans-serif" font-size="11" fill="#d0d8ff">・Q3売上: 前年比+12%</text>
  <text x="34" y="161" font-family="-apple-system,sans-serif" font-size="11" fill="#aaaacc">📷 14:35 143512.png</text>
  <text x="34" y="178" font-family="-apple-system,sans-serif" font-size="11" fill="#d0d8ff">・次回アクションアイテム</text>
  <text x="34" y="195" font-family="-apple-system,sans-serif" font-size="11" fill="#aaaacc">  🔍 OCR認識完了</text>
  <text x="34" y="212" font-family="-apple-system,sans-serif" font-size="11" fill="#d0d8ff">・田中さん担当: 資料作成 7/25まで</text>
  <!-- Cursor blinking -->
  <rect x="34" y="218" width="2" height="14" fill="#7c9ff5" opacity="0.9"/>
  <text x="36" y="230" font-family="-apple-system,sans-serif" font-size="11" fill="#d0d8ff">|</text>

  <text x="270" y="298" font-family="-apple-system,sans-serif" font-size="11" fill="#8888aa" text-anchor="middle">Memoボタンでテキストエリアを展開。常時自動保存。</text>
</svg>
